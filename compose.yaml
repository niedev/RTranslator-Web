services:
  rtranslator:
    image: ghcr.io/niedev/rtranslator-web:latest
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3847

    ports:
      - "127.0.0.1:3847:3847"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped

    depends_on:
      - rtranslator

    environment:
      LAN_HOST: ${LAN_HOST}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: